  zh-CN: "GitHub 检查失败：%{error}"
  ja: "GitHub の確認に失敗しました: %{error}"
notice.check_github_token_failed:
  en: "Could not check the GitHub token: %{error}"
  zh-CN: "无法检查 GitHub 令牌：%{error}"
  ja: "GitHub トークンを確認できませんでした: %{error}"
notice.github_check_unfinished:
  en: "GitHub check did not finish."
  zh-CN: "GitHub 检查未完成。"
  ja: "GitHub の確認が完了しませんでした。"
notice.github_token_cleared:
  en: "GitHub token cleared."
  zh-CN: "GitHub 令牌已清除。"
  ja: "GitHub トークンを削除しました。"
notice.clear_github_token_failed:
  en: "Could not clear the GitHub token: %{error}"
  zh-CN: "无法清除 GitHub 令牌：%{error}"
  ja: "GitHub トークンを削除できませんでした: %{error}"
notice.language_set:
  en: "Language set to %{language}."
  zh-CN: "界面语言已设为 %{language}。"
  ja: "言語を %{language} に設定しました。"
notice.save_language_failed:
  en: "Could not save the language: %{error}"
  zh-CN: "无法保存语言设置：%{error}"
  ja: "言語を保存できませんでした: %{error}"
notice.ui_scale_set:
  en: "Interface scale set to %{level}x."
  zh-CN: "界面缩放已设为 %{level}x。"
  ja: "表示スケールを %{level}x に設定しました。"
notice.save_settings_failed:
  en: "Could not save settings: %{error}"
  zh-CN: "无法保存设置：%{error}"
  ja: "設定を保存できませんでした: %{error}"
notice.release_prerelease:
  en: "%{repo} only has a prerelease: %{tag}. Review it before updating."
  zh-CN: "%{repo} 仅有预发布版：%{tag}。更新前请先查看。"
  ja: "%{repo} にはプレリリースしかありません: %{tag}。アップデート前に確認してください。"
notice.release_found:
  en: "%{repo} has release %{tag}."
  zh-CN: "%{repo} 有发布版本 %{tag}。"
  ja: "%{repo} にリリース %{tag} があります。"
notice.change_busy:
  en: "Another enable or disable change is running."
  zh-CN: "另一个启用或禁用操作正在进行。"
  ja: "別の有効化または無効化の処理が実行中です。"
notice.file_change_busy:
  en: "Another mod file change is running."
  zh-CN: "另一个模组文件操作正在进行。"
  ja: "別のMODファイル操作が実行中です。"
notice.mod_gone:
  en: "That mod is no longer in the list."
  zh-CN: "该模组已不在列表中。"
  ja: "そのMODはリストに存在しません。"
settings.bepinex:
  en: "BepInEx"
  zh-CN: "BepInEx"

  en: "This game is built with IL2CPP, so BepInEx cannot load mods into it."
  zh-CN: "这个游戏用 IL2CPP 打包，BepInEx 装不了模组。"
  ja: "このゲームは IL2CPP 製のため、BepInEx では MOD を読み込めません。"

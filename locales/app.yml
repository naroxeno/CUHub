  zh-CN: "修复 BEPINEX"
  ja: "BEPINEX を修復"
bepinex.no_game_folder:
  en: "Choose the game folder first."
  zh-CN: "先选择游戏文件夹。"
  ja: "先にゲームフォルダを選択してください。"
bepinex.not_installed:
  en: "Not installed."
  zh-CN: "未安装。"
  ja: "未インストール。"
bepinex.installed:
  en: "BepInEx %{version} is installed."
  zh-CN: "已安装 BepInEx %{version}。"
  ja: "BepInEx %{version} はインストール済みです。"

  en: "5 (stable)"
  zh-CN: "5（稳定）"
  ja: "5（安定版）"
bepinex.flavor_experimental:
  en: "6 (experimental)"
  zh-CN: "6（试验）"
  ja: "6（試験版）"
bepinex.flavor_conflict:
  en: "BepInEx %{installed} is installed. To switch to %{selected}, remove the old install first."
  zh-CN: "现在装的是 BepInEx %{installed}。要换成 %{selected}，先手动删掉旧的安装。"
  ja: "BepInEx %{installed} がインストールされています。%{selected} に切り替えるには、先に古いインストールを削除してください。"
bepinex.plan_summary:
  en: "Install BepInEx %{version}?"
  zh-CN: "安装 BepInEx %{version}？"
  ja: "BepInEx %{version} をインストールしますか？"
bepinex.plan_conflicts:
  en: "The game folder has conflicting files, so nothing was changed."
  zh-CN: "游戏目录里有冲突的文件，没有改动任何东西。"
  ja: "ゲームフォルダに競合するファイルがあるため、何も変更していません。"
bepinex.repair_scope:
  en: "Replaces the BepInEx core files. Your plugins and config stay, and replaced files are backed up first."
  zh-CN: "会替换 BepInEx 的核心文件。你装的插件和配置都保留，被替换的文件会先备份。"
  ja: "BepInEx のコアファイルを置き換えます。プラグインと設定はそのまま残り、置き換えるファイルは先にバックアップされます。"

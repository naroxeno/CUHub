[package]
name = "cuprum"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[dependencies]
cuprum-core = { path = "../core" }
nsh-core = "0.7.1"
nsh-base = { version = "0.7.1", default-features = false }
env_logger = "0.11"
toml = "1.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.7.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.7.1", default-features = false }
